name: Deploy relay to Vercel

# Redeploys the backend relay (server/) to Vercel production on every push
# to main. Requires three repository secrets (Settings -> Secrets and
# variables -> Actions):
#   VERCEL_TOKEN      - a Vercel API token
#   VERCEL_ORG_ID     - from server/.vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID - from the same file
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes
