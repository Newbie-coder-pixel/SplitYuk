name: Deploy web app

# Builds the Flutter web version of SplitYuk and deploys it to Vercel as a
# static site. This is the install-free way to use the app: a URL opened in
# Safari or Chrome, "Add to Home Screen" for an icon, and none of iOS's
# Developer Mode / 7-day re-signing that sideloading a build requires.
#
# Reuses the VERCEL_TOKEN and VERCEL_ORG_ID secrets that deploy-relay.yml
# already needs. The project id is written in plain text below rather than
# stored as a secret: it is an identifier, not a credential, and is useless
# without the token — and hardcoding it means no extra repo setup.
#
# It points at a SECOND Vercel project (splityuk-web). Reusing the relay's
# project id here would overwrite the API with a static site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # Without this define the app cannot reach the relay, and both the AI
      # receipt reader and notification sending report themselves as
      # unconfigured — the same flag the iOS build passes.
      - name: Build web
        working-directory: app
        run: >
          flutter build web --release
          --dart-define=SPLITYUK_RELAY_URL=https://splityuk-relay.vercel.app

      - name: Deploy to Vercel (production)
        working-directory: app/build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          # Vercel project "splityuk-web" (newbie-coder-pixel's projects).
          VERCEL_PROJECT_ID: prj_LL7df03X8dMP0YBwYgjI1dMfZdoX
        run: npx vercel@latest deploy --prod --yes
